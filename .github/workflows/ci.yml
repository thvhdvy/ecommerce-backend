name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Prepare application.properties
        run: cp src/main/resources/application.properties.example src/main/resources/application.properties

      - name: Run tests
        run: ./mvnw test
        env:
          # application.properties.example's jwt.secret placeholder isn't valid base64;
          # override with a real (test-only, not sensitive) base64 secret so JwtService can start.
          JWT_SECRET: c1DJ1Sa61Wjw59g141+ahqPHLytYpeQiHKg93X9eHdaZy7iV9e/KbizK3iOzK3TEowqWrjNxpOCfq9bSfM0Bmg==
